<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>PlayAuto Remote</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,600,0,0&display=swap" />
    <style>
      :root {
        color-scheme: light;
        font-family: "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
        --bg: #e4c49a;
        --surface: #edd4ad;
        --surface-elevated: #ddb882;
        --text: #2f1608;
        --text-secondary: #3a1c0c;
        --text-muted: #6b3d22;
        --subtitle: #3a1c0c;
        --accent: #d46520;
        --timer-track: #cfa060;
        --timer-progress: #2ecc71;
        --online: #2f9e44;
        --offline: #c0392b;
        --shadow: 0 4px 10px rgba(58, 28, 12, 0.28);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--text);
        background-color: var(--bg);
        background-image: url('./assets/game_background1.png');
        background-size: cover;
        background-position: center top;
        background-repeat: no-repeat;
        background-attachment: fixed;
      }

      .page {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        width: 100%;
        max-width: 520px;
        margin: 0 auto;
      }

      .app-header {
        flex-shrink: 0;
        padding: 16px 16px 8px;
        text-align: center;
        position: relative;
      }

      .logo-stage {
        position: relative;
        width: 120px;
        height: 120px;
        margin: 0 auto;
        display: grid;
        place-items: center;
      }

      .logo-glare {
        position: absolute;
        inset: -22px;
        border-radius: 50%;
        background:
          radial-gradient(circle at center, rgba(255, 246, 200, 0.85) 0%, rgba(255, 224, 138, 0.35) 42%, rgba(255, 208, 96, 0) 70%),
          repeating-conic-gradient(
            from 0deg,
            rgba(255, 236, 170, 0.42) 0deg 8deg,
            transparent 8deg 20deg
          );
        animation: spin-glare 16s linear infinite;
        pointer-events: none;
      }

      @keyframes spin-glare {
        to {
          transform: rotate(360deg);
        }
      }

      .app-logo {
        position: relative;
        z-index: 1;
        width: 112px;
        height: 112px;
        display: block;
        object-fit: contain;
        filter: drop-shadow(0 3px 4px rgba(42, 18, 8, 0.35));
      }

      .app-main {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 16px;
        padding: 8px 16px 28px;
        min-height: 0;
      }

      .page.pick-game-mode .app-main {
        justify-content: flex-start;
      }

      .page.pick-game-mode .app-header {
        padding-bottom: 4px;
      }

      .page.pick-game-mode .logo-stage {
        width: 96px;
        height: 96px;
      }

      .page.pick-game-mode .app-logo {
        width: 88px;
        height: 88px;
      }

      .panel {
        background: var(--surface);
        border-radius: 14px;
        padding: 16px;
        box-shadow: var(--shadow);
      }

      .status-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 14px;
        background: var(--surface);
        border-radius: 12px;
        box-shadow: var(--shadow);
      }

      .status-label {
        font-size: 14px;
        color: var(--text-secondary);
        font-weight: 800;
      }

      .status-value {
        font-size: 14px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.3px;
      }

      .status-value.online {
        color: var(--online);
      }

      .status-value.offline {
        color: var(--offline);
      }

      .results-head {
        text-align: center;
        display: grid;
        gap: 4px;
        padding: 8px 8px 0;
      }

      .results-title {
        margin: 0;
        font-size: 30px;
        font-weight: 900;
        color: #ffffff;
        text-shadow:
          -1px -1px 0 #000,
          0 -1px 0 #000,
          1px -1px 0 #000,
          -1px 0 0 #000,
          1px 0 0 #000,
          -1px 1px 0 #000,
          0 1px 0 #000,
          1px 1px 0 #000,
          0 2px 2px rgba(0, 0, 0, 0.45);
      }

      .results-subtitle {
        margin: 0 0 4px;
        font-size: 16px;
        font-weight: 800;
        color: var(--subtitle);
      }

      .score-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .score-card {
        background: var(--surface);
        border-radius: 14px;
        padding: 16px 12px;
        display: grid;
        gap: 10px;
        justify-items: center;
        box-shadow: var(--shadow);
      }

      .score-name {
        font-size: 16px;
        font-weight: 800;
        color: var(--text);
        text-align: center;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .score-controls {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .score-value {
        min-width: 44px;
        min-height: 44px;
        padding: 0 10px;
        display: grid;
        place-items: center;
        font-size: 24px;
        font-weight: 900;
        color: #ffffff;
        text-align: center;
        background: url('./assets/circle-button.png') center / contain no-repeat;
        text-shadow:
          -1px -1px 0 #000,
          0 -1px 0 #000,
          1px -1px 0 #000,
          -1px 0 0 #000,
          1px 0 0 #000,
          -1px 1px 0 #000,
          0 1px 0 #000,
          1px 1px 0 #000;
      }

      .score-btn {
        width: 44px;
        height: 44px;
        border: none;
        padding: 0;
        background: transparent;
        background-image: url('./assets/emptysquare-button.png');
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
        color: #ffffff;
        font-size: 24px;
        font-weight: 900;
        line-height: 44px;
        cursor: pointer;
        text-shadow:
          -1px -1px 0 #000,
          1px -1px 0 #000,
          -1px 1px 0 #000,
          1px 1px 0 #000;
        filter: drop-shadow(0 2px 2px rgba(42, 18, 8, 0.35));
      }

      .score-btn:active {
        transform: scale(0.96);
      }

      .score-row.results-mode .score-card {
        gap: 8px;
      }

      .win-badge-slot {
        display: none;
        min-height: calc(48px * (106 / 146) + 8px);
        align-items: center;
        justify-content: center;
        width: 100%;
      }

      .score-row.results-mode .win-badge-slot {
        display: flex;
      }

      .win-badge {
        width: 48px;
        height: calc(48px * (106 / 146));
        filter: drop-shadow(0 3px 3px rgba(42, 18, 8, 0.35));
      }

      .game-hud {
        display: grid;
        gap: 10px;
        padding: 14px 16px;
        width: 100%;
        background: var(--surface);
        border-radius: 14px;
        box-shadow: var(--shadow);
      }

      .round-label {
        font-size: 16px;
        font-weight: 800;
        color: var(--text);
        text-align: center;
      }

      .word-game-panel {
        display: grid;
        gap: 10px;
        justify-items: stretch;
      }

      .word-game-header {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 6px;
        font-size: 15px;
        font-weight: 800;
        color: var(--text);
      }

      .word-game-header-value {
        flex: 1;
        min-width: 0;
        font-weight: 900;
      }

      .word-game-prompt {
        font-size: 22px;
        font-weight: 800;
        color: var(--text);
        text-align: center;
        line-height: 1.25;
        padding: 4px 2px 2px;
      }

      .word-game-letter-block {
        display: grid;
        gap: 4px;
        justify-items: center;
        padding: 4px 0 2px;
      }

      .word-game-letter-caption {
        font-size: 15px;
        font-weight: 800;
        color: var(--text);
      }

      .word-game-letter {
        font-size: 64px;
        font-weight: 900;
        line-height: 1;
        color: #ffffff;
        text-shadow:
          -2px -2px 0 #000,
          0 -2px 0 #000,
          2px -2px 0 #000,
          -2px 0 0 #000,
          2px 0 0 #000,
          -2px 2px 0 #000,
          0 2px 0 #000,
          2px 2px 0 #000,
          0 3px 3px rgba(0, 0, 0, 0.4);
      }

      .word-game-meta {
        display: grid;
        gap: 4px;
        justify-items: center;
        text-align: center;
      }

      .word-game-meta-row {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        justify-content: center;
        gap: 6px;
        font-size: 16px;
        font-weight: 800;
        color: var(--text);
      }

      .word-game-meta-value {
        font-weight: 900;
      }

      .turn-hint {
        font-size: 14px;
        font-weight: 800;
        text-align: center;
        color: var(--text-secondary);
      }

      .timer-wrap {
        position: relative;
        width: 72px;
        height: 72px;
        justify-self: center;
      }

      .timer-svg {
        display: block;
        width: 72px;
        height: 72px;
      }

      .timer-label {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        font-weight: 900;
        color: var(--text);
        pointer-events: none;
      }

      .infinite-timer {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: url('./assets/circle-button.png') center / contain no-repeat;
        font-size: 28px;
        font-weight: 900;
        color: #111;
        text-shadow: none;
      }

      .game-controls {
        display: grid;
        gap: 10px;
        padding: 14px 16px;
        width: 100%;
        background: var(--surface);
        border-radius: 14px;
        box-shadow: var(--shadow);
      }

      .control-row {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 4px 0;
      }

      .control-row + .control-row {
        border-top: 1px solid rgba(90, 52, 28, 0.22);
        padding-top: 12px;
      }

      .control-label {
        font-size: 16px;
        font-weight: 800;
        color: var(--text);
      }

      .control-row:has(.icon-btn:disabled) .control-label {
        opacity: 0.45;
      }

      .icon-btn {
        width: 52px;
        height: 52px;
        border: none;
        padding: 0;
        background: transparent;
        cursor: pointer;
        flex-shrink: 0;
        filter: drop-shadow(0 3px 3px rgba(42, 18, 8, 0.3));
      }

      .icon-btn img {
        width: 52px;
        height: 52px;
        display: block;
      }

      .icon-btn:active:not(:disabled) {
        transform: scale(0.96);
      }

      .icon-btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
        filter: none;
      }

      .play-again-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding-top: 4px;
      }

      .play-again-btn,
      .change-game-btn {
        border: none;
        padding: 0;
        width: 220px;
        background: transparent;
        cursor: pointer;
        filter: drop-shadow(0 4px 5px rgba(42, 18, 8, 0.35));
      }

      .change-game-btn {
        width: 300px;
      }

      .play-again-bg,
      .change-game-bg {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 220px;
        aspect-ratio: 154 / 50;
        background: url('./assets/startgame-button.png') center / 100% 100% no-repeat;
      }

      .change-game-bg {
        width: 300px;
      }

      .play-again-text,
      .change-game-text {
        color: #ffffff;
        font-weight: 900;
        font-size: 16px;
        padding: 0 36px 0 12px;
        text-align: center;
        text-shadow:
          -1px -1px 0 #000,
          0 -1px 0 #000,
          1px -1px 0 #000,
          -1px 0 0 #000,
          1px 0 0 #000,
          -1px 1px 0 #000,
          0 1px 0 #000,
          1px 1px 0 #000;
      }

      .change-game-text {
        font-size: 15px;
      }

      .play-again-icon,
      .change-game-icon {
        position: absolute;
        right: -10px;
        width: 50px;
        height: 50px;
        pointer-events: none;
      }

      .pick-game-panel {
        display: flex;
        flex-direction: column;
        gap: 12px;
        flex: 1;
        min-height: 0;
      }

      .pick-game-title {
        margin: 0;
        text-align: center;
        font-size: 20px;
        font-weight: 800;
        color: var(--text);
        padding: 0 8px;
      }

      .pick-game-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        overflow-y: auto;
        padding: 4px 2px 8px;
        -webkit-overflow-scrolling: touch;
      }

      .pick-game-card {
        background: var(--surface);
        border-radius: 12px;
        padding: 14px;
        min-height: 168px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        box-shadow: var(--shadow);
        border: none;
        text-align: left;
        color: inherit;
        cursor: pointer;
        font: inherit;
      }

      .pick-game-card:disabled {
        opacity: 0.55;
        cursor: default;
      }

      .pick-game-card-header {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .pick-game-icon {
        width: 56px;
        height: 56px;
        border-radius: 12px;
        object-fit: contain;
        flex-shrink: 0;
      }

      .pick-game-icon-fallback {
        width: 56px;
        height: 56px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        color: var(--accent);
        font-size: 36px;
        font-variation-settings: 'FILL' 0, 'wght' 600, 'GRAD' 0, 'opsz' 24;
      }

      .pick-game-card:disabled .pick-game-icon-fallback {
        color: var(--text-muted);
      }

      .pick-game-card-title {
        flex: 1;
        font-size: 15px;
        font-weight: 700;
        color: var(--text);
        line-height: 1.2;
      }

      .pick-game-card-tagline {
        flex: 1;
        font-size: 12px;
        line-height: 1.35;
        color: var(--text-muted);
      }

      .pick-game-play {
        align-self: flex-start;
        display: flex;
        align-items: center;
        justify-content: center;
        width: min(118px, 100%);
        aspect-ratio: 507 / 141;
        background: url('./assets/difficulty_medium.png') center / 100% 100% no-repeat;
        color: #fff;
        font-weight: 900;
        font-size: 13px;
        text-shadow:
          0 1px 1.5px #000,
          -1px -1px 0 #000,
          1px 1px 0 #000;
      }

      .pick-game-soon {
        align-self: flex-start;
        padding: 4px 10px;
        border-radius: 999px;
        background: var(--surface-elevated);
        color: var(--text-muted);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.3px;
      }

      .pick-game-back {
        border: none;
        background: var(--surface-elevated);
        color: var(--text);
        font-weight: 800;
        font-size: 14px;
        padding: 12px 16px;
        border-radius: 12px;
        box-shadow: var(--shadow);
        cursor: pointer;
      }

      .hidden {
        display: none !important;
      }

      .fazauto-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        width: 100%;
      }

      .fazauto-actions.single-action {
        grid-template-columns: 1fr;
        max-width: 280px;
        margin: 0 auto;
      }

      .word-game-keep {
        display: grid;
        gap: 14px;
        padding: 8px 0 4px;
      }

      .word-game-keep-ask {
        font-size: 18px;
        font-weight: 900;
        text-align: center;
        color: var(--text);
        line-height: 1.3;
      }

      .cate-mark-panel {
        display: grid;
        gap: 8px;
        padding: 4px 0;
        justify-items: center;
      }

      .cate-word-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px 10px;
        width: 100%;
        max-width: 420px;
        margin: 0 auto;
        justify-items: center;
      }

      .cate-word-tile {
        position: relative;
        width: 100%;
        max-width: 200px;
        aspect-ratio: 1347 / 358;
        min-height: 44px;
        border: 0;
        border-radius: 0;
        padding: 0;
        background: transparent url('./assets/empty_container.png') center / 100% 100% no-repeat;
        color: #2f1608;
        box-shadow: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .cate-word-tile-label {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 80%;
        height: 54%;
        padding: 0 2px;
        font-size: 12px;
        font-weight: 800;
        line-height: 1.15;
        text-align: center;
        color: #2f1608;
        overflow: hidden;
      }

      .cate-word-tile.marked {
        opacity: 0.88;
      }

      .cate-word-tile.marked .cate-word-tile-label {
        text-decoration: line-through;
        opacity: 0.7;
      }

      .cate-word-check {
        position: absolute;
        top: 14%;
        right: 8%;
        width: 14px;
        height: 14px;
        pointer-events: none;
      }

      .cate-mark-count {
        text-align: center;
        font-size: 13px;
        font-weight: 700;
        color: var(--text-muted);
      }

      .cate-play-hint {
        text-align: center;
        font-size: 13px;
        font-weight: 700;
        color: var(--text-muted);
        margin-top: 6px;
      }

      .fazauto-btn {
        border: none;
        border-radius: 12px;
        min-height: 72px;
        padding: 12px 10px;
        font-size: 16px;
        font-weight: 900;
        color: #ffffff;
        cursor: pointer;
        text-shadow:
          -1px -1px 0 #000,
          1px -1px 0 #000,
          -1px 1px 0 #000,
          1px 1px 0 #000;
        box-shadow: var(--shadow);
        background: var(--surface-elevated) url('./assets/startgame-button.png') center / 100% 100% no-repeat;
      }

      .fazauto-btn.foul {
        background-color: #c0392b;
      }

      .fazauto-btn.ok {
        background-color: #2f9e44;
      }

      .fazauto-btn.medium-cta {
        min-height: 56px;
        font-size: 22px;
        background: transparent url('./assets/difficulty_medium.png') center / 100% 100% no-repeat;
        box-shadow: none;
        border-radius: 0;
      }

      .fazauto-btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .fazauto-btn:active:not(:disabled) {
        transform: scale(0.97);
      }

      .letter-picker {
        display: grid;
        gap: 10px;
        padding: 14px 16px;
        width: 100%;
        background: var(--surface);
        border-radius: 14px;
        box-shadow: var(--shadow);
      }

      .letter-picker-title {
        font-size: 15px;
        font-weight: 800;
        text-align: center;
        color: var(--text);
      }

      .letter-grid {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 8px;
      }

      .letter-btn {
        border: none;
        border-radius: 10px;
        min-height: 44px;
        background: var(--surface-elevated);
        color: var(--text);
        font-size: 18px;
        font-weight: 900;
        cursor: pointer;
        box-shadow: var(--shadow);
      }

      .letter-btn:active {
        transform: scale(0.96);
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="app-header">
        <div class="logo-stage">
          <div class="logo-glare" aria-hidden="true"></div>
          <img id="app-logo" src="./assets/icon_playauto.png" class="app-logo" alt="PlayAuto" />
        </div>
      </header>

      <main class="app-main">
        <div class="status-row">
          <span class="status-label">Connection</span>
          <span id="status" class="status-value offline">Connecting...</span>
        </div>

        <div id="results-head" class="results-head hidden">
          <h1 id="game-over-label" class="results-title">Game Over</h1>
          <p id="final-scores-label" class="results-subtitle">Final Scores</p>
        </div>

        <div id="game-hud" class="game-hud hidden">
          <div id="round-label" class="round-label">Round 1 / 20</div>

          <div id="word-game-panel" class="word-game-panel hidden">
            <div id="word-game-header" class="word-game-header">
              <span id="word-game-header-label"></span>
              <span id="word-game-header-value" class="word-game-header-value"></span>
            </div>
            <div id="word-game-prompt" class="word-game-prompt hidden"></div>
            <div id="word-game-letter-block" class="word-game-letter-block hidden">
              <div id="word-game-letter-caption" class="word-game-letter-caption"></div>
              <div id="word-game-letter" class="word-game-letter">—</div>
            </div>
            <div id="word-game-meta" class="word-game-meta hidden">
              <div id="word-game-letter-inline-row" class="word-game-meta-row">
                <span id="word-game-letter-inline-label"></span>
                <span id="word-game-letter-inline" class="word-game-meta-value">—</span>
              </div>
              <div class="word-game-meta-row">
                <span id="word-game-turn-label"></span>
                <span id="word-game-turn-value" class="word-game-meta-value">—</span>
              </div>
              <div id="word-game-awaiting" class="turn-hint"></div>
            </div>
            <div id="word-game-keep" class="word-game-keep hidden">
              <div id="keep-category-ask" class="word-game-keep-ask">Keep this category?</div>
              <div id="fazauto-actions" class="fazauto-actions">

      const normalizeSessionId = (value) => String(value || '').trim().toUpperCase();

      const statusEl = document.getElementById('status');

      timerProgressEl.setAttribute('stroke-dasharray', `${TIMER_CIRCUMFERENCE} ${TIMER_CIRCUMFERENCE}`);
      timerProgressEl.setAttribute('stroke-dashoffset', String(TIMER_CIRCUMFERENCE));

      const GAME_LOGOS = {
        trivia: { src: './assets/icon.png', alt: 'Triviauto' },
        'last-letter': { src: './assets/icon_fazauto.png', alt: 'FazAuto' },
        'ce-incape-in-valiza': {
          src: './assets/icon_ceinvapeinvaliza.png',
          alt: 'Ce încape în valiză?',
        },
        'what-would-they-say': {
          src: './assets/icon_cearface.png',
          alt: 'Ce ar face?',
        },
        'cate-stii': {
          src: './assets/icon_catestii.png',
          alt: 'Câte știi?',
        },
        default: { src: './assets/icon_playauto.png', alt: 'PlayAuto' },
      };

      const WORD_GAME_COPY = {
        en: {
          category: 'Theme:',
          container: 'What fits in:',
          letter: 'Letter',
          letterColon: 'Letter:',
          starts: 'Starts:',
          join: 'and',
        },
        ro: {
          category: 'Categorie:',
          container: 'Ce încape în:',
          letter: 'Literă',
          letterColon: 'Literă:',
          starts: 'Începe:',
          join: 'și',
        },
      };

      const capitalizeFirst = (value) => {
        const text = String(value || '').trim();
        if (!text) return '';
        return text.charAt(0).toUpperCase() + text.slice(1);
      };

      const buildSuitcasePrompt = (payload, joinWord) => {
        const container = String(payload.themeLabel || '').trim();
        const modifier = String(payload.modifierLabel || '').trim();
        if (!container && !modifier) return '';
        if (!modifier) return capitalizeFirst(container);
        return capitalizeFirst(`${container} ${joinWord} ${modifier}`);
      };

      const setAppLogo = (gameId) => {
        const logo = GAME_LOGOS[gameId] || GAME_LOGOS.default;
        if (appLogoEl.getAttribute('src') !== logo.src) {
          appLogoEl.setAttribute('src', logo.src);
        }
        appLogoEl.setAttribute('alt', logo.alt);
      };

      const params = new URLSearchParams(window.location.search);
      const session = normalizeSessionId(params.get('session'));

      const setStatus = (text, online) => {
        statusEl.textContent = text;
        statusEl.classList.toggle('online', online);
        statusEl.classList.toggle('offline', !online);
      };

      if (!session) {
        setStatus('Missing session in URL', false);
        commandButtons.forEach((btn) => {
          btn.disabled = true;
        });
        throw new Error('Missing session query parameter');
      }

      const channelName = `trivia_session_${session}`;
      const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false },
      });

      const CONTROL_LABELS = {
        ro: {
          pause: 'Pauza',
          resume: 'Resume game',
          endGame: 'Incheie jocul',
          blockQuestion: 'Blocheaza intrebarea',
          blockCategory: 'Blocheaza categoria',
          blockContainer: 'Blocheaza recipientul',
          blockModifier: 'Blocheaza conditia',
          blockTopic: 'Blocheaza subiectul',
        },
        en: {
          pause: 'Pause',
          resume: 'Resume game',
          endGame: 'End game',
          blockQuestion: 'Block question',
          blockCategory: 'Block category',
          blockContainer: 'Block container',
          blockModifier: 'Block rule',
          blockTopic: 'Block topic',
        },
      };

      const getControlLabels = (language) => CONTROL_LABELS[language] ?? CONTROL_LABELS.en;
      let lastTap = 0;
      let remoteState = {
        isPaused: false,
        canPause: false,
        canStop: false,
        canBlockQuestion: false,
        canPlayAgain: false,
        canChangeGame: false,
        canCancelGamePicker: false,
        canKeepCategory: false,
        canMarkWords: false,
        scoreIncDec: true,
        gameId: 'trivia',
      };

      const sendCommand = async (action, extra = {}) => {
        const now = Date.now();
        if (now - lastTap < 120) return;
        lastTap = now;
        await channel.send({
          type: 'broadcast',
          event: 'score_remote_command',
          payload: { action, source: 'remote_web', ...extra },
        });
      };

      const updateTimer = (payload = {}, isResults = false, isPickGame = false) => {
        const showHud = !isResults && !isPickGame;
        gameHudEl.classList.toggle('hidden', !showHud);
        if (!showHud) {
          wordGamePanelEl.classList.add('hidden');
          if (cateMarkPanelEl) cateMarkPanelEl.classList.add('hidden');
          if (catePlayHintEl) catePlayHintEl.classList.add('hidden');
          return;
        }

        const lang = payload.appLanguage === 'ro' ? 'ro' : 'en';
        const copy = WORD_GAME_COPY[lang];
        const roundWord = lang === 'ro' ? 'Runda' : 'Round';
        const currentRound = payload.currentRound ?? 1;
        const roundsTotal = payload.roundsTotal ?? 1;
        const gameId = payload.gameId || 'trivia';
        const isFazAuto = gameId === 'last-letter';
        const isSuitcase = gameId === 'ce-incape-in-valiza';
        const isWwts = gameId === 'what-would-they-say';
        const isCateStii = gameId === 'cate-stii';
        const isNoTimerWordGame = isFazAuto || isSuitcase;
        const phase = payload.fazautoPhase || null;
        const isKeep = isFazAuto && phase === 'keep_category';
        const isNextQuestion = isWwts && phase === 'next_question';
        const isCateMarking = isCateStii && phase === 'marking';
        const letter = payload.letterLabel || '';
        const turnName = payload.turnPlayerName || '';

        roundLabelEl.textContent = `${roundWord} ${currentRound} / ${roundsTotal}`;
        setAppLogo(isResults ? 'default' : gameId);

        wordGamePanelEl.classList.toggle(
          'hidden',
          !(isNoTimerWordGame || isNextQuestion || isCateStii)
        );
        if (cateMarkPanelEl) {
          cateMarkPanelEl.classList.toggle('hidden', !isCateMarking);
        }
        if (catePlayHintEl) {
          catePlayHintEl.classList.toggle(
            'hidden',
            !isCateStii || isCateMarking || isResults
          );
          if (isCateStii && !isCateMarking) {
            catePlayHintEl.textContent =
              payload.wordsHiddenHintLabel ||
              (lang === 'ro'
                ? 'Cuvintele rămân ascunse până expiră timpul'
                : 'Words stay hidden until time is up');
          }
        }

        if (isCateStii) {
          wordGameKeepEl.classList.add('hidden');
          wordGameHeaderLabelEl.textContent =
            payload.speakerLabel || (lang === 'ro' ? 'Vorbește' : 'Speaking');
          wordGameHeaderValueEl.textContent = turnName || '…';
          wordGamePromptEl.textContent = payload.themeLabel || '';
          wordGamePromptEl.classList.toggle('hidden', !payload.themeLabel);
          wordGameLetterBlockEl.classList.add('hidden');
          wordGameMetaEl.classList.add('hidden');
          wordGameLetterInlineRowEl.classList.add('hidden');
          turnHintEl.classList.add('hidden');

          if (isCateMarking && cateWordGridEl) {
            const words = Array.isArray(payload.cateWords) ? payload.cateWords : [];
            const marked = Array.isArray(payload.cateMarked) ? payload.cateMarked : [];
            cateMarkAskEl.textContent =
              payload.markWordsAskLabel ||
              (lang === 'ro' ? 'Bifați ce s-a spus' : 'Tick what was said');
              cateConfirmBtn.textContent =
              payload.markWordsConfirmLabel ||
              (lang === 'ro' ? 'Confirmă' : 'Confirm');
            cateWordGridEl.innerHTML = '';
            words.forEach((word, index) => {
              const btn = document.createElement('button');
              btn.type = 'button';
              btn.className = `cate-word-tile${marked[index] ? ' marked' : ''}`;
              const label = document.createElement('span');
              label.className = 'cate-word-tile-label';
              label.textContent = word;
              btn.appendChild(label);
              if (marked[index]) {
                const check = document.createElement('img');
                check.className = 'cate-word-check';
                check.src = './assets/categories_checkmark.png';
                check.alt = '';
                btn.appendChild(check);
              }
              btn.addEventListener('click', () => {
                sendCommand('toggle_cate_word', { wordIndex: index });
                if (navigator.vibrate) navigator.vibrate(15);
              });
              cateWordGridEl.appendChild(btn);
            });
            const countLabel =
              payload.markWordsCountLabel || (lang === 'ro' ? 'Bifate' : 'Marked');
            cateMarkCountEl.textContent = `${countLabel}: ${
              payload.cateMarkedCount ?? marked.filter(Boolean).length
            }/${words.length}`;
          }
        } else if (isNextQuestion) {
          wordGameHeaderLabelEl.textContent = lang === 'ro' ? 'Întrebare' : 'Question';
          wordGameHeaderValueEl.textContent = '';
          wordGamePromptEl.textContent = payload.questionLabel || '';
          wordGamePromptEl.classList.toggle('hidden', !payload.questionLabel);
          wordGameLetterBlockEl.classList.add('hidden');
          wordGameMetaEl.classList.add('hidden');
          wordGameLetterInlineRowEl.classList.add('hidden');
          wordGameKeepEl.classList.remove('hidden');
          turnHintEl.classList.add('hidden');
          turnHintEl.textContent = '';
          keepCategoryAskEl.textContent =
            payload.keepCategoryAskLabel ||
            (lang === 'ro' ? 'Trecem la următoarea?' : 'Next question?');
          // Fall through to trivia-style countdown ring (usually 0 between questions)
        } else if (isNoTimerWordGame) {
          if (isSuitcase) {
            wordGameKeepEl.classList.add('hidden');
            wordGameHeaderLabelEl.textContent = copy.container;
            wordGameHeaderValueEl.textContent = '';
            const prompt = buildSuitcasePrompt(payload, copy.join);
            wordGamePromptEl.textContent = prompt;
            wordGamePromptEl.classList.toggle('hidden', !prompt || isKeep);
            wordGameLetterBlockEl.classList.add('hidden');
            wordGameMetaEl.classList.toggle('hidden', isKeep);
            wordGameLetterInlineRowEl.classList.remove('hidden');
            wordGameLetterInlineLabelEl.textContent = copy.letterColon;
            wordGameLetterInlineEl.textContent = letter || '—';
            wordGameTurnLabelEl.textContent = copy.starts;
            wordGameTurnValueEl.textContent = turnName || '—';
            wordGameAwaitingEl.textContent =
              payload.awaitingScoreLabel ||
              (lang === 'ro'
                ? 'Runda se termină când un jucător rămâne fără cuvinte'
                : 'Play until someone scores');
            turnHintEl.classList.add('hidden');
            turnHintEl.textContent = '';
          } else {
            wordGameHeaderLabelEl.textContent = copy.category;
            wordGameHeaderValueEl.textContent = payload.themeLabel || '…';
            wordGamePromptEl.classList.add('hidden');
            wordGamePromptEl.textContent = '';
            if (isKeep) {
              wordGameLetterBlockEl.classList.add('hidden');
              wordGameMetaEl.classList.add('hidden');
              wordGameKeepEl.classList.remove('hidden');
              turnHintEl.classList.add('hidden');
              turnHintEl.textContent = '';
              keepCategoryAskEl.textContent =
                payload.keepCategoryAskLabel ||
                (lang === 'ro' ? 'Păstrăm categoria?' : 'Keep this category?');
            } else {
              wordGameLetterBlockEl.classList.remove('hidden');
              wordGameLetterCaptionEl.textContent = copy.letter;
              wordGameLetterEl.textContent = letter || '—';
              wordGameMetaEl.classList.remove('hidden');
              wordGameKeepEl.classList.add('hidden');
              wordGameLetterInlineRowEl.classList.add('hidden');
              wordGameTurnLabelEl.textContent = copy.starts;
              wordGameTurnValueEl.textContent = turnName || '—';
              wordGameAwaitingEl.textContent =
                payload.awaitingScoreLabel ||
                (lang === 'ro'
                  ? 'Runda se termină când un jucător rămâne fără cuvinte'
                  : 'Play until someone scores');
              turnHintEl.classList.add('hidden');
              turnHintEl.textContent = '';
            }
          }
        } else {
          wordGameKeepEl.classList.add('hidden');
        }

        const paused = Boolean(payload.isPaused);
        if (isNoTimerWordGame) {
          timerSvgEl.classList.add('hidden');
          timerLabelEl.classList.add('hidden');
          infiniteTimerEl.classList.remove('hidden');
          infiniteTimerEl.textContent = paused ? 'II' : '∞';
          return;

        timerSvgEl.classList.remove('hidden');
        timerLabelEl.classList.remove('hidden');
        infiniteTimerEl.classList.add('hidden');

        const answerTime = payload.answerTimeSec || 10;
        const countdown = payload.countdownSec ?? 0;
        const progress =
          countdown > 0 && answerTime > 0 ? Math.max(0, Math.min(1, countdown / answerTime)) : 0;

        timerLabelEl.textContent = paused ? 'II' : String(countdown);
        timerProgressEl.setAttribute(
          'stroke-dashoffset',
          String(TIMER_CIRCUMFERENCE * (1 - progress))
        );
      };

      const renderPickGameGrid = (payload = {}) => {
        const games = Array.isArray(payload.availableGames) ? payload.availableGames : [];
        const playLabel = payload.playLabel || 'Play';
        const comingSoonLabel = payload.comingSoonLabel || 'Coming soon';
        pickGameGridEl.innerHTML = '';

        games.forEach((game) => {
          const available = Boolean(game.available);
          const card = document.createElement('button');
          card.type = 'button';
          card.className = 'pick-game-card';
          card.disabled = !available;
          card.setAttribute(
            'aria-label',
            `${game.title || game.id}. ${available ? playLabel : comingSoonLabel}`
          );

          const header = document.createElement('div');
          header.className = 'pick-game-card-header';

          if (game.iconFile) {
            const img = document.createElement('img');
            img.className = 'pick-game-icon';
            img.src = `./assets/${game.iconFile}`;
            img.alt = '';
            header.appendChild(img);
          } else {
            const icon = document.createElement('span');
            icon.className = 'pick-game-icon-fallback material-symbols-outlined';
            icon.textContent = String(game.iconName || 'sports_esports').replace(/-/g, '_');
            header.appendChild(icon);
          }

          const title = document.createElement('div');
          title.className = 'pick-game-card-title';
          title.textContent = game.title || game.id;
          header.appendChild(title);
          card.appendChild(header);

          const tagline = document.createElement('div');
          tagline.className = 'pick-game-card-tagline';
          tagline.textContent = game.tagline || '';
          card.appendChild(tagline);

          if (available) {
            const play = document.createElement('div');
            play.className = 'pick-game-play';
            play.textContent = playLabel;
            card.appendChild(play);
            card.addEventListener('click', () => {
              sendCommand('change_game', { gameId: game.id });
              if (navigator.vibrate) navigator.vibrate(20);
            });
          } else {
            const soon = document.createElement('div');
            soon.className = 'pick-game-soon';
            soon.textContent = comingSoonLabel;
            card.appendChild(soon);
          }

          pickGameGridEl.appendChild(card);
        });
      };

      const applyRemoteState = (payload = {}) => {
        const isPickGame = payload.screen === 'pick_game';
        const isResults =
          !isPickGame && (payload.screen === 'results' || Boolean(payload.canPlayAgain));
        const isFazAuto = payload.gameId === 'last-letter';
        const isWwts = payload.gameId === 'what-would-they-say';
        const isCateStii = payload.gameId === 'cate-stii';
        const isNoTimerWordGame =
          payload.gameId === 'last-letter' || payload.gameId === 'ce-incape-in-valiza';
        const canKeep = Boolean(payload.canKeepCategory);
        const canMarkWords = Boolean(payload.canMarkWords);

        setAppLogo(isPickGame ? 'default' : payload.gameId || 'default');

        p1NameEl.textContent = payload.player1Name || 'Player 1';
        p2NameEl.textContent = payload.player2Name || 'Player 2';
        p1ScoreEl.textContent = String(payload.score1 ?? 0);
        p2ScoreEl.textContent = String(payload.score2 ?? 0);

        gameOverLabelEl.textContent = payload.gameOverLabel || 'Game Over';
        finalScoresLabelEl.textContent = payload.finalScoresLabel || 'Final Scores';
        playAgainTextEl.textContent = payload.playAgainLabel || 'Play Again';
        changeGameTextEl.textContent = payload.changeGameLabel || 'Change game';
        pickGameTitleEl.textContent = payload.hubTitle || 'Car Games';
        pickGameBackBtn.textContent = payload.backToResultsLabel || 'Back to results';

        p1WinEl.classList.toggle('hidden', !isResults || payload.winner !== 'p1');
        p2WinEl.classList.toggle('hidden', !isResults || payload.winner !== 'p2');

        scoreRowEl.classList.toggle('results-mode', isResults);
        scoreRowEl.classList.toggle('hidden', isPickGame);

        resultsHeadEl.classList.toggle('hidden', !isResults);
        gameControlsEl.classList.toggle('hidden', isResults || isPickGame);
        playAgainWrap.classList.toggle('hidden', !isResults);
        pickGamePanelEl.classList.toggle('hidden', !isPickGame);
        statusEl.closest('.status-row')?.classList.toggle('hidden', isPickGame);
        document.querySelector('.page')?.classList.toggle('pick-game-mode', isPickGame);

        if (isPickGame) {
          renderPickGameGrid(payload);
        }

        remoteState = {
          isPaused: Boolean(payload.isPaused),
          canPause: Boolean(payload.canPause),
          canStop: Boolean(payload.canStop),
          canBlockQuestion: Boolean(payload.canBlockQuestion),
          canPlayAgain: Boolean(payload.canPlayAgain),
          canChangeGame: Boolean(payload.canChangeGame),
          canCancelGamePicker: Boolean(payload.canCancelGamePicker),
          canKeepCategory: canKeep,
          canMarkWords,
          scoreIncDec: Boolean(payload.scoreIncDec),
          gameId: payload.gameId || 'trivia',
        };

        changeGameBtn.disabled = !remoteState.canChangeGame;
        pickGameBackBtn.disabled = !remoteState.canCancelGamePicker;
        pauseBtn.disabled = !remoteState.canPause;
        stopBtn.disabled = !remoteState.canStop;
        blockBtn.disabled = !remoteState.canBlockQuestion;
        if (blockRow) {
          blockRow.classList.toggle(
            'hidden',
            isResults ||
              isPickGame ||
              isWwts ||
              (isCateStii && payload.fazautoPhase !== 'playing')
          );
        }

        const showScoreControls = remoteState.scoreIncDec && !isResults && !isPickGame;
        scoreBtns.forEach((btn) => {
          btn.classList.toggle('hidden', !showScoreControls);
          btn.disabled = !showScoreControls;
        });

        fazautoActionsEl.classList.toggle(
          'hidden',
          (!isFazAuto && !isWwts) || isResults || isPickGame || !canKeep
        );
        wordGameKeepEl.classList.toggle(
          'hidden',
          (!isFazAuto && !isWwts) ||
            isResults ||
            isPickGame ||
            !canKeep ||
            (payload.fazautoPhase !== 'keep_category' &&
              payload.fazautoPhase !== 'next_question')
        );
        if (cateMarkPanelEl) {
          cateMarkPanelEl.classList.toggle(
            'hidden',
            !isCateStii ||
              isResults ||
              isPickGame ||
              payload.fazautoPhase !== 'marking'
          );
        }
        keepCategoryAskEl.textContent =
          payload.keepCategoryAskLabel || 'Keep this category?';
        keepYesBtn.textContent = payload.keepCategoryYesLabel || 'Yes — same category';
        keepNoBtn.textContent = payload.keepCategoryNoLabel || 'No — new category';
        keepYesBtn.disabled = !canKeep;
        keepNoBtn.disabled = !canKeep;
        keepNoBtn.classList.toggle('hidden', isWwts || isCateStii);
        fazautoActionsEl.classList.toggle('single-action', isWwts);
        keepYesBtn.classList.toggle('medium-cta', isWwts);
        if (cateConfirmBtn) {
          cateConfirmBtn.disabled = !canMarkWords;
        }

        const labels = getControlLabels(payload.appLanguage);
        pauseLabelEl.textContent = remoteState.isPaused ? labels.resume : labels.pause;
        stopLabelEl.textContent = labels.endGame;
        blockLabelEl.textContent =
          payload.blockQuestionLabel ||
          (payload.gameId === 'last-letter'
            ? labels.blockCategory
            : payload.gameId === 'ce-incape-in-valiza'
              ? labels.blockModifier || 'Block rule'
              : payload.gameId === 'cate-stii'
                ? labels.blockTopic || 'Block topic'
              : labels.blockQuestion);

        pauseIcon.src = remoteState.isPaused
          ? './assets/play-circle.png'
          : './assets/pause-circle.png';
        pauseBtn.setAttribute('aria-label', remoteState.isPaused ? 'Resume' : 'Pause');

        updateTimer(payload, isResults, isPickGame);
      };

      const channel = client
        .channel(channelName, { config: { broadcast: { self: false } } })
        .on('broadcast', { event: 'score_state' }, ({ payload }) => {
          applyRemoteState(payload);
        });

      channel.subscribe((status) => {
        if (status === 'SUBSCRIBED') {
          setStatus('Connected', true);
          channel.send({
            type: 'broadcast',
            event: 'score_remote_command',
            payload: { action: 'request_state', source: 'remote_web' },
          });
          return;
        }
        if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') setStatus('Disconnected', false);
        else if (status === 'CLOSED') setStatus('Offline', false);
        else setStatus(`Status: ${status}`, false);
      });

      keepYesBtn.addEventListener('click', () => {
        if (!remoteState.canKeepCategory) return;
        sendCommand('keep_category_yes');
        if (navigator.vibrate) navigator.vibrate(20);
      });

      if (cateConfirmBtn) {
        cateConfirmBtn.addEventListener('click', () => {
          if (!remoteState.canMarkWords) return;
          sendCommand('confirm_cate_marks');
          if (navigator.vibrate) navigator.vibrate(20);
        });
      }

      keepNoBtn.addEventListener('click', () => {
        if (!remoteState.canKeepCategory) return;
        sendCommand('keep_category_no');
        if (navigator.vibrate) navigator.vibrate(20);
      });

      changeGameBtn.addEventListener('click', () => {
        if (!remoteState.canChangeGame) return;
        sendCommand('open_game_picker');
        if (navigator.vibrate) navigator.vibrate(20);
      });

      pickGameBackBtn.addEventListener('click', () => {
        if (!remoteState.canCancelGamePicker) return;
        sendCommand('cancel_game_picker');
        if (navigator.vibrate) navigator.vibrate(20);
      });

      commandButtons.forEach((button) => {
        button.addEventListener('click', () => {
          sendCommand(button.dataset.action);
          if (navigator.vibrate) navigator.vibrate(20);
        });
      });
    </script>
  </body>
</html>
