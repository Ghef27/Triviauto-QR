<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>PlayAuto Remote</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,600,0,0&display=swap" />
    <style>
      :root {
        color-scheme: light;
        font-family: "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
        --bg: #e4c49a;
        --surface: #edd4ad;
        --surface-elevated: #ddb882;
        --text: #2f1608;
        --text-secondary: #3a1c0c;
        --text-muted: #6b3d22;
        --subtitle: #3a1c0c;
        --accent: #d46520;
        --timer-track: #cfa060;
        --timer-progress: #2ecc71;
        --online: #2f9e44;
        --offline: #c0392b;
        --shadow: 0 4px 10px rgba(58, 28, 12, 0.28);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--text);
        background-color: var(--bg);
        background-image: url('./assets/game_background1.png');
        background-size: cover;
        background-position: center top;
        background-repeat: no-repeat;
        background-attachment: fixed;
      }

      .page {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        width: 100%;
        max-width: 520px;
        margin: 0 auto;
      }

      .app-header {
        flex-shrink: 0;
        padding: 16px 16px 8px;
        text-align: center;
        position: relative;
      }

      .logo-stage {
        position: relative;
        width: 120px;
        height: 120px;
        margin: 0 auto;
        display: grid;
        place-items: center;
      }

      .logo-glare {
        position: absolute;
        width: 164px;
        height: 164px;
        display: grid;
        place-items: center;
        transform: scale(1.05);
        animation: spin-glare 16s linear infinite;
        pointer-events: none;
      }

      .logo-glare svg {
        width: 140px;
        height: 140px;
        display: block;
        overflow: visible;
      }

      @keyframes spin-glare {
        to {
          transform: scale(1.05) rotate(360deg);
        }
      }

      .app-logo {
        position: relative;
        z-index: 1;
        width: 112px;
        height: 112px;
        display: block;
        object-fit: contain;
        filter: drop-shadow(0 3px 4px rgba(42, 18, 8, 0.35));
      }

      .app-main {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 16px;
        padding: 8px 16px 28px;
        min-height: 0;
      }

      .page.pick-game-mode .app-main {
        justify-content: flex-start;
      }

      .page.pick-game-mode .app-header {
        padding-bottom: 4px;
      }

      .page.pick-game-mode .logo-stage {
        width: 96px;
        height: 96px;
      }

      .page.pick-game-mode .app-logo {
        width: 88px;
        height: 88px;
      }

      .panel {
        background: var(--surface);
        border-radius: 14px;
        padding: 16px;
        box-shadow: var(--shadow);
      }

      .status-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 14px;
        background: var(--surface);
        border-radius: 12px;
        box-shadow: var(--shadow);
      }

      .status-label {
        font-size: 14px;
        color: var(--text-secondary);
        font-weight: 800;
      }

      .status-value {
        font-size: 14px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.3px;
      }

      .status-value.online {
        color: var(--online);
      }

      .status-value.offline {
        color: var(--offline);
      }

      .results-head {
        text-align: center;
        display: grid;
        gap: 4px;
        padding: 8px 8px 0;
      }

      .results-title {
        margin: 0;
        font-size: 30px;
        font-weight: 900;
        color: #ffffff;
        text-shadow:
          -1px -1px 0 #000,
          0 -1px 0 #000,
          1px -1px 0 #000,
          -1px 0 0 #000,
          1px 0 0 #000,
          -1px 1px 0 #000,
          0 1px 0 #000,
          1px 1px 0 #000,
          0 2px 2px rgba(0, 0, 0, 0.45);
      }

      .results-subtitle {
        margin: 0 0 4px;
        font-size: 16px;
        font-weight: 800;
        color: var(--subtitle);
      }

      .score-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .score-row.coop-mode {
        grid-template-columns: 1fr;
      }

      .score-row.coop-mode .score-card.coop-hidden {
        display: none;
      }

      .score-row.coop-mode .score-card.coop-main {
        padding: 18px 16px;
      }

      .score-subtitle {
        font-size: 13px;
        font-weight: 700;
        color: var(--subtitle);
        text-align: center;
        margin-top: -4px;
      }

      .score-subtitle.hidden {
        display: none;
      }

      .drunkard-panel {
        display: grid;
        gap: 14px;
        margin-top: 2px;
      }

      .drunkard-panel.hidden {
        display: none;
      }

      .memoria-panel {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 2px;
        min-height: 0;
      }

      .memoria-panel.hidden {
        display: none;
      }

      .memoria-panel.scoring {
        gap: 6px;
      }

      .memoria-hint {
        font-size: 18px;
        font-weight: 800;
        text-align: center;
        color: var(--text);
        line-height: 1.25;
        flex-shrink: 0;
      }

      .memoria-words-caption {
        font-size: 14px;
        font-weight: 800;
        text-align: center;
        color: var(--text-muted);
        flex-shrink: 0;
      }

      .memoria-words-caption.hidden {
        display: none;
      }

      .memoria-words {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        text-align: center;
        font-size: 16px;
        font-weight: 700;
        color: var(--text);
        flex: 1 1 auto;
        min-height: 120px;
        max-height: min(38vh, 280px);
        overflow: auto;
        line-height: 1.35;
        width: 100%;
        max-width: 360px;
        margin: 0 auto;
        padding: 4px 2px;
      }

      .memoria-words.dense {
        font-size: 13px;
        max-height: min(42vh, 300px);
      }

      .memoria-word-col {
        display: flex;
        flex-direction: column;
        justify-content: space-evenly;
        min-width: 0;
        gap: 2px;
      }

      .memoria-words .memoria-word {
        width: 100%;
        text-align: center;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .memoria-score-footer {
        display: grid;
        gap: 6px;
        justify-items: center;
        flex-shrink: 0;
        padding-top: 2px;
      }

      .memoria-score-footer.hidden {
        display: none;
      }

      .memoria-stepper {
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
      }

      .memoria-stepper-btn {
        width: 42px;
        height: 36px;
        border: none;
        padding: 0;
        cursor: pointer;
        color: #fff;
        font-size: 22px;
        font-weight: 900;
        line-height: 1;
        text-shadow:
          -1px -1px 0 #000,
          1px -1px 0 #000,
          -1px 1px 0 #000,
          1px 1px 0 #000;
        box-shadow: none;
        border-radius: 0;
        flex-shrink: 0;
      }

      .memoria-stepper-btn.hard {
        background: transparent url('./assets/difficulty_hard.png') center / 100% 100% no-repeat;
      }

      .memoria-stepper-btn.medium {
        background: transparent url('./assets/difficulty_medium.png') center / 100% 100% no-repeat;
      }

      .memoria-stepper-btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .memoria-stepper-btn:active:not(:disabled) {
        transform: scale(0.96);
      }

      .memoria-stepper-value-wrap {
        min-width: 64px;
        text-align: center;
      }

      .memoria-stepper-value {
        text-align: center;
        font-size: 20px;
        font-weight: 900;
        color: var(--text);
        line-height: 1.1;
      }

      .memoria-stepper-label {
        text-align: center;
        font-size: 11px;
        line-height: 13px;
        font-weight: 700;
        color: var(--text-muted);
      }

      .memoria-confirm-row {
        width: 100%;
        display: flex;
        justify-content: center;
      }

      .memoria-confirm-btn {
        width: 148px;
        min-height: 0;
        height: auto;
        aspect-ratio: 507 / 141;
        font-size: 16px;
        padding: 0;
      }

      .drunkard-bridge {
        text-align: center;
        padding: 4px 2px 2px;
      }

      .drunkard-bridge.hidden {
        display: none;
      }

      .drunkard-bridge-row {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        gap: 8px;
        align-items: center;
      }

      .drunkard-bridge-col {
        display: grid;
        gap: 6px;
        justify-items: center;
        min-width: 0;
      }

      .drunkard-bridge-caption {
        font-size: 11px;
        font-weight: 700;
        line-height: 1.2;
        color: var(--subtitle);
        text-align: center;
      }

      .drunkard-bridge-word {
        font-size: 22px;
        font-weight: 900;
        color: var(--text);
        line-height: 1.2;
        text-align: center;
        word-break: break-word;
      }

      .drunkard-bridge-arrow {
        font-size: 22px;
        font-weight: 900;
        color: var(--text);
        margin-top: 14px;
      }

      .drunkard-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .drunkard-actions .fazauto-btn {
        min-height: 48px;
        font-size: 16px;
        padding: 8px 6px;
      }

      .drunkard-actions.hidden {
        display: none;
      }

      .score-card {
        background: var(--surface);
        border-radius: 14px;
        padding: 16px 12px;
        display: grid;
        gap: 10px;
        justify-items: center;
        box-shadow: var(--shadow);
      }

      .score-name {
        flex-shrink: 1;
        min-width: 0;
      }

      .score-name-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        max-width: 100%;
        padding: 0 2px;
      }

      .score-avatar {
        width: 46px;
        height: calc(36px * 376 / 328);
        flex-shrink: 0;
        object-fit: contain;
        display: block;
      }

      .score-avatar.hidden {
        display: none !important;
      }

      .score-controls {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .score-btn.hidden {
        display: none !important;
      }

      .score-value {
        min-width: 44px;
        min-height: 44px;
        padding: 0 10px;
        display: grid;
        place-items: center;
        font-size: 24px;
        font-weight: 900;
        color: #ffffff;
        text-align: center;
        background: url('./assets/circle-button.png') center / contain no-repeat;
        text-shadow:
          -1px -1px 0 #000,
          0 -1px 0 #000,
          1px -1px 0 #000,
          -1px 0 0 #000,
          1px 0 0 #000,
          -1px 1px 0 #000,
          0 1px 0 #000,
          1px 1px 0 #000;
      }

      .score-btn {
        width: 44px;
        height: 44px;
        border: none;
        padding: 0;
        background: transparent;
        background-image: url('./assets/emptysquare-button.png');
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
        color: #ffffff;
        font-size: 24px;
        font-weight: 900;
        line-height: 44px;
        cursor: pointer;
        text-shadow:
          -1px -1px 0 #000,
          1px -1px 0 #000,
          -1px 1px 0 #000,
          1px 1px 0 #000;
        filter: drop-shadow(0 2px 2px rgba(42, 18, 8, 0.35));
      }

      .score-btn:active {
        transform: scale(0.96);
      }

      .score-row.results-mode .score-card {
        gap: 10px;
        padding-top: 18px;
        padding-bottom: 18px;
      }

      /* Results: avatar above name, larger — same for all games */
      .score-row.results-mode:not(.coop-mode) .score-name-row {
        flex-direction: column;
        gap: 8px;
      }

      .score-row.results-mode:not(.coop-mode) .score-avatar:not(.hidden) {
        order: -1;
        width: 72px;
        height: calc(56px * 376 / 328);
      }

      .score-row.results-mode.coop-mode .score-name-row {
        flex-direction: row;
        gap: 8px;
      }

      .score-row.results-mode.coop-mode .score-avatar:not(.hidden) {
        width: 56px;
        height: calc(44px * 376 / 328);
      }

      .win-badge-slot {
        display: none;
        align-items: center;
        justify-content: center;
        width: 100%;
      }

      .score-row.results-mode .win-badge-slot.has-winner {
        display: flex;
        min-height: calc(48px * (106 / 146) + 8px);
      }

      .win-badge {
        width: 48px;
        height: calc(48px * (106 / 146));
        filter: drop-shadow(0 3px 3px rgba(42, 18, 8, 0.35));
      }

      .game-hud {
        display: grid;
        gap: 10px;
        padding: 14px 16px;
        width: 100%;
        background: var(--surface);
        border-radius: 14px;
        box-shadow: var(--shadow);
      }

      .round-label {
        font-size: 16px;
        font-weight: 800;
        color: var(--text);
        text-align: center;
      }

      .trivia-answer-panel {
        display: grid;
        gap: 6px;
        width: 100%;
        text-align: center;
        padding: 4px 4px 2px;
      }

      .trivia-answer-panel.hidden {
        display: none;
      }

      .trivia-answer-label {
        font-size: 14px;
        font-weight: 800;
        color: var(--text-muted);
      }

      .trivia-answer-value {
        font-size: 22px;
        font-weight: 900;
        color: var(--text);
        line-height: 1.25;
        word-break: break-word;
      }

      .word-game-panel {
        display: grid;
        gap: 10px;
        justify-items: stretch;
      }

      .word-game-header {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 6px;
        font-size: 15px;
        font-weight: 800;
        color: var(--text);
      }

      .word-game-header.hidden {
        display: none;
      }

      .word-game-header-value {
        flex: 1;
        min-width: 0;
        font-weight: 900;
      }

      .wwts-roles {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        width: 100%;
      }

      .wwts-roles.hidden {
        display: none;
      }

      .wwts-role {
        min-width: 0;
        text-align: center;
      }

      .wwts-role-label {
        display: block;
        font-size: 13px;
        font-weight: 800;
        color: var(--text-muted);
      }

      .wwts-role-name {
        display: block;
        font-size: 16px;
        font-weight: 900;
        color: var(--text);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .word-game-prompt {
        font-size: 22px;
        font-weight: 800;
        color: var(--text);
        text-align: center;
        line-height: 1.25;
        padding: 4px 2px 2px;
      }

      .word-game-prompt.statements {
        white-space: pre-line;
        text-align: left;
        max-height: min(42vh, 320px);
        overflow: hidden;
        width: 100%;
      }

      .word-game-letter-block {
        display: grid;
        gap: 4px;
        justify-items: center;
        padding: 4px 0 2px;
      }

      .word-game-letter-caption {
        font-size: 15px;
        font-weight: 800;
        color: var(--text);
      }

      .word-game-letter {
        font-size: 64px;
        font-weight: 900;
        line-height: 1;
        color: #ffffff;
        text-shadow:
          -2px -2px 0 #000,
          0 -2px 0 #000,
          2px -2px 0 #000,
          -2px 0 0 #000,
          2px 0 0 #000,
          -2px 2px 0 #000,
          0 2px 0 #000,
          2px 2px 0 #000,
          0 3px 3px rgba(0, 0, 0, 0.4);
      }

      .word-game-meta {
        display: grid;
        gap: 4px;
        justify-items: center;
        text-align: center;
      }

      .word-game-meta-row {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        justify-content: center;
        gap: 6px;
        font-size: 16px;
        font-weight: 800;
        color: var(--text);
      }

      .word-game-meta-value {
        font-weight: 900;
      }

      .turn-hint {
        font-size: 14px;
        font-weight: 800;
        text-align: center;
        color: var(--text-secondary);
      }

      .timer-wrap {
        position: relative;
        width: 72px;
        height: 72px;
        justify-self: center;
      }

      .banana-points-badge {
        position: absolute;
        right: calc(100% + 10px);
        top: 50%;
        transform: translateY(-50%);
        min-width: 56px;
        height: 56px;
        border-radius: 28px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: var(--surface-elevated);
        box-shadow: var(--shadow);
        z-index: 2;
      }

      .banana-points-badge.hidden {
        display: none;
      }

      .banana-points-value {
        font-size: 20px;
        font-weight: 900;
        line-height: 1;
        color: var(--text);
      }

      .banana-points-unit {
        font-size: 10px;
        font-weight: 800;
        text-transform: uppercase;
        color: var(--text-muted);
      }

      .drunkard-words-badge {
        position: absolute;
        right: calc(100% + 10px);
        top: 50%;
        transform: translateY(-50%);
        min-width: 72px;
        max-width: 88px;
        height: 64px;
        padding: 6px;
        border-radius: 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        background: var(--surface-elevated);
        border: 2px solid rgba(58, 28, 12, 0.35);
        box-shadow: var(--shadow);
        z-index: 2;
      }

      .drunkard-words-badge.hidden {
        display: none;
      }

      .drunkard-words-value {
        font-size: 20px;
        font-weight: 900;
        line-height: 1;
        color: var(--text);
      }

      .drunkard-words-label {
        font-size: 9px;
        line-height: 1.15;
        font-weight: 800;
        color: var(--text-muted);
        text-align: center;
      }

      .timer-svg {
        display: block;
        width: 72px;
        height: 72px;
      }

      .timer-label {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        font-weight: 900;
        color: var(--text);
        pointer-events: none;
      }

      .infinite-timer {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: url('./assets/circle-button.png') center / contain no-repeat;
        font-size: 28px;
        font-weight: 900;
        color: #111;
        text-shadow: none;
      }

      .game-controls {
        display: grid;
        gap: 10px;
        padding: 14px 16px;
        width: 100%;
        background: var(--surface);
        border-radius: 14px;
        box-shadow: var(--shadow);
        position: sticky;
        bottom: 8px;
        z-index: 30;
      }

      .control-row {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 4px 0;
      }

      .control-row + .control-row {
        border-top: 1px solid rgba(90, 52, 28, 0.22);
        padding-top: 12px;
      }

      .control-label {
        font-size: 16px;
        font-weight: 800;
        color: var(--text);
      }

      .control-row:has(.icon-btn:disabled) .control-label {
        opacity: 0.45;
      }

      .icon-btn {
        width: 52px;
        height: 52px;
        border: none;
        padding: 0;
        background: transparent;
        cursor: pointer;
        flex-shrink: 0;
        filter: drop-shadow(0 3px 3px rgba(42, 18, 8, 0.3));
      }

      .icon-btn img {
        width: 52px;
        height: 52px;
        display: block;
      }

      .icon-btn:active:not(:disabled) {
        transform: scale(0.96);
      }

      .icon-btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
        filter: none;
      }

      .play-again-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding-top: 4px;
      }

      .play-again-btn,
      .change-game-btn {
        border: none;
        padding: 0;
        width: 220px;
        background: transparent;
        cursor: pointer;
        filter: drop-shadow(0 4px 5px rgba(42, 18, 8, 0.35));
      }

      .change-game-btn {
        width: 300px;
      }

      .play-again-bg,
      .change-game-bg {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 220px;
        aspect-ratio: 154 / 50;
        background: url('./assets/startgame-button.png') center / 100% 100% no-repeat;
      }

      .change-game-bg {
        width: 300px;
      }

      .play-again-text,
      .change-game-text {
        color: #ffffff;
        font-weight: 900;
        font-size: 16px;
        padding: 0 36px 0 12px;
        text-align: center;
        text-shadow:
          -1px -1px 0 #000,
          0 -1px 0 #000,
          1px -1px 0 #000,
          -1px 0 0 #000,
          1px 0 0 #000,
          -1px 1px 0 #000,
          0 1px 0 #000,

          if (memoriaPanelEl) memoriaPanelEl.classList.add('hidden');
          if (wwtsRolesEl) wwtsRolesEl.classList.add('hidden');

          wordGamePromptEl.style.maxHeight = '';

          wordGamePromptEl.classList.toggle(

            !wordGamePromptEl.textContent

          wordGameLetterBlockEl.classList.add('hidden');
          wordGameMetaEl.classList.add('hidden');
          wordGameLetterInlineRowEl.classList.add('hidden');

        } else if (isNoTimerWordGame) {

          if (isSuitcase) {

            wordGamePromptEl.style.maxHeight = '';

            wordGameTurnValueEl.textContent = turnName || '—';

              (lang === 'ro'

          } else {
            wordGameHeaderLabelEl.textContent = copy.category;
            wordGameHeaderValueEl.textContent = payload.themeLabel || '…';

            wordGamePromptEl.style.fontSize = '';
            wordGamePromptEl.style.maxHeight = '';
            wordGamePromptEl.classList.add('hidden');
            wordGamePromptEl.textContent = '';
            if (isKeep) {

              wordGameMetaEl.classList.add('hidden');
              wordGameKeepEl.classList.remove('hidden');
              turnHintEl.classList.add('hidden');
              turnHintEl.textContent = '';

                (lang === 'ro' ? 'Păstrăm categoria?' : 'Keep this category?');

              wordGameLetterBlockEl.classList.remove('hidden');

              wordGameLetterEl.textContent = letter || '—';

              wordGameLetterInlineRowEl.classList.add('hidden');

              wordGameTurnValueEl.textContent = turnName || '—';

          wordGameKeepEl.classList.add('hidden');

        const paused = Boolean(payload.isPaused);

        const hideDrunkardTimer =
          isDrunkard && phase !== 'playing';
        const hideMemoriaTimer =
          isMemoria && phase !== 'recalling';
        if (
          isNoTimerWordGame ||
          (isClueRace && isClueTyping) ||
          isBananaPrep ||
          hideBananaTimer ||
          hideDrunkardTimer ||
          hideMemoriaTimer

          if (
            (isClueRace && isClueTyping) ||
            isBananaPrep ||
            hideBananaTimer ||
            hideDrunkardTimer ||
            hideMemoriaTimer
          ) {
            timerSvgEl.classList.add('hidden');
            timerLabelEl.classList.add('hidden');
            infiniteTimerEl.classList.add('hidden');
            return;

          timerSvgEl.classList.add('hidden');
          timerLabelEl.classList.add('hidden');
          infiniteTimerEl.classList.remove('hidden');

        timerSvgEl.classList.remove('hidden');
        timerLabelEl.classList.remove('hidden');
        infiniteTimerEl.classList.add('hidden');

        const countdown = Number(payload.countdownSec) || 0;
        const answerTime =
          Number(payload.countdownTotalSec) > 0
            ? Number(payload.countdownTotalSec)
            : Number(payload.answerTimeSec) > 0
              ? Number(payload.answerTimeSec)
              : isDrunkard
                ? 60
                : isBanana
                  ? 300
                  : isCateStii
                    ? 60
                    : 10;
        const progress =
          countdown > 0 && answerTime > 0
            ? Math.max(0, Math.min(1, countdown / answerTime))
            : 0;

        timerLabelEl.textContent = paused ? 'II' : String(countdown);
        timerProgressEl.setAttribute(
          'stroke-dashoffset',
          String(TIMER_CIRCUMFERENCE * (1 - progress))
        );
      };

      const renderPickGameGrid = (payload = {}) => {
        const games = Array.isArray(payload.availableGames) ? payload.availableGames : [];
        const playLabel = payload.playLabel || 'Play';
        const comingSoonLabel = payload.comingSoonLabel || 'Coming soon';
        pickGameGridEl.innerHTML = '';

        games.forEach((game) => {
          const available = Boolean(game.available);
          const card = document.createElement('button');
          card.type = 'button';
          card.className = 'pick-game-card';
          card.disabled = !available;
          card.setAttribute(
            'aria-label',
            `${game.title || game.id}. ${available ? playLabel : comingSoonLabel}`
          );

          const header = document.createElement('div');
          header.className = 'pick-game-card-header';

          if (game.iconFile) {
            const img = document.createElement('img');
            img.className = 'pick-game-icon';
            img.src = `./assets/${game.iconFile}`;
            img.alt = '';
            header.appendChild(img);
          } else {
            const icon = document.createElement('span');
            icon.className = 'pick-game-icon-fallback material-symbols-outlined';
            icon.textContent = String(game.iconName || 'sports_esports').replace(/-/g, '_');
            header.appendChild(icon);
          }

          const title = document.createElement('div');
          title.className = 'pick-game-card-title';
          title.textContent = game.title || game.id;
          header.appendChild(title);
          card.appendChild(header);

          const tagline = document.createElement('div');
          tagline.className = 'pick-game-card-tagline';
          tagline.textContent = game.tagline || '';
          card.appendChild(tagline);

          if (available) {
            const play = document.createElement('div');
            play.className = 'pick-game-play';
            play.textContent = playLabel;
            card.appendChild(play);
            card.addEventListener('click', () => {
              sendCommand('change_game', { gameId: game.id });
              if (navigator.vibrate) navigator.vibrate(20);
            });
          } else {
            const soon = document.createElement('div');
            soon.className = 'pick-game-soon';
            soon.textContent = comingSoonLabel;
            card.appendChild(soon);
          }

          pickGameGridEl.appendChild(card);
        });
      };

      const applyRemoteState = (payload = {}) => {

        const isPickGame =
          payload.screen === 'pick_game' ||
          payload.screen === 'hub' ||
          payload.screen === 'setup';
        const isResults =
          !isPickGame && (payload.screen === 'results' || Boolean(payload.canPlayAgain));
        const isFazAuto = payload.gameId === 'last-letter';
        const isWwts = payload.gameId === 'what-would-they-say';
        const isFactOrFiction = payload.gameId === 'fact-or-fiction';
        const isBeep = payload.gameId === 'beep';
        const isCateStii = payload.gameId === 'cate-stii';
        const isClueRace = payload.gameId === 'clue-race';
        const isBanana = payload.gameId === 'sunt-o-banana';
        const isDrunkard = payload.gameId === 'povestea-betivului';
        const isMemoria = payload.gameId === 'memoria-vitezei';

        const isNoTimerWordGame =
          payload.gameId === 'last-letter' || payload.gameId === 'ce-incape-in-valiza';
        const canKeep = Boolean(payload.canKeepCategory);
        const canMarkWords = Boolean(payload.canMarkWords);
        const canBuzz = Boolean(payload.canBuzz);
        const canTypeGuess = Boolean(payload.canTypeGuess);
        const canBananaGuess = Boolean(payload.canBananaGuess);
        const canDrunkardPair = Boolean(payload.canDrunkardPair);
        const canMemoriaScore = Boolean(payload.canMemoriaScore);

        setAppLogo(isPickGame ? 'default' : payload.gameId || 'default');

        if (isCoop) {

          p1ScoreEl.textContent = String(

          setScoreAvatar(p1AvatarLeftEl, payload.player1AvatarId, 'players_1');
          setScoreAvatar(p1AvatarEl, payload.player2AvatarId, 'players_2');
          setScoreAvatar(p2AvatarEl, null, 'players_2', { hidden: true });

        } else {
          p1NameEl.textContent = payload.player1Name || 'Player 1';
          p2NameEl.textContent = payload.player2Name || 'Player 2';
          p1ScoreEl.textContent = String(payload.score1 ?? 0);
          p2ScoreEl.textContent = String(payload.score2 ?? 0);
          setScoreAvatar(p1AvatarLeftEl, null, 'players_1', { hidden: true });
          setScoreAvatar(p1AvatarEl, payload.player1AvatarId, 'players_1');

          canDrunkardPair,

        pickGameBackBtn.disabled = !remoteState.canCancelGamePicker;
        pickGameBackBtn.classList.toggle('hidden', !remoteState.canCancelGamePicker);

        stopBtn.disabled = !remoteState.canStop;
        blockBtn.disabled = !remoteState.canBlockQuestion;
        if (blockRow) {
          blockRow.classList.toggle(
            'hidden',
            isResults ||
              isPickGame ||
              isWwts ||
              (isFactOrFiction &&
                payload.fazautoPhase !== 'announce' &&
                payload.fazautoPhase !== 'playing') ||
              (isBeep &&
                payload.fazautoPhase !== 'listening' &&
                payload.fazautoPhase !== 'beep' &&
                payload.fazautoPhase !== 'playing') ||
              (isBanana &&
                payload.fazautoPhase !== 'prep' &&
                payload.fazautoPhase !== 'playing') ||
              (isDrunkard && payload.fazautoPhase !== 'playing') ||
              isMemoria ||
              (isClueRace &&
                payload.fazautoPhase !== 'clue_window' &&
                payload.fazautoPhase !== 'typing') ||
              (isCateStii && payload.fazautoPhase !== 'playing')

            !isFactOrFiction &&

            isResults ||
            isPickGame ||
            !canKeep

        wordGameKeepEl.classList.toggle(
          'hidden',
          (!isFazAuto &&
            !isWwts &&
            !isFactOrFiction &&
            !isBanana &&
            !isDrunkard) ||
            isResults ||
            isPickGame ||
            !canKeep ||
            (payload.fazautoPhase !== 'keep_category' &&
              payload.fazautoPhase !== 'next_question' &&
              payload.fazautoPhase !== 'prep' &&
              payload.fazautoPhase !== 'next_round')
        );
        if (cateMarkPanelEl) {
          cateMarkPanelEl.classList.toggle(
            'hidden',
            !isCateStii ||
              isResults ||
              isPickGame ||
              payload.fazautoPhase !== 'marking'

        keepCategoryAskEl.textContent =
          payload.keepCategoryAskLabel || 'Keep this category?';
        keepYesBtn.textContent = payload.keepCategoryYesLabel || 'Yes — same category';
        keepNoBtn.textContent = payload.keepCategoryNoLabel || 'No — new category';
        keepYesBtn.disabled = !canKeep;
        keepNoBtn.disabled = !canKeep;
        keepNoBtn.classList.toggle(
          'hidden',
          isWwts || isFactOrFiction || isCateStii || isBanana || isDrunkard
        );

          isWwts || isFactOrFiction || isBanana || isDrunkard
        );
        keepYesBtn.classList.toggle(

        blockLabelEl.textContent =
          payload.blockQuestionLabel ||
          (payload.gameId === 'last-letter'
            ? labels.blockCategory
            : payload.gameId === 'ce-incape-in-valiza'
              ? labels.blockModifier || 'Block rule'
              : payload.gameId === 'cate-stii'
                ? labels.blockTopic || 'Block topic'
                : payload.gameId === 'clue-race'
                  ? payload.blockQuestionLabel ||
                    (payload.appLanguage === 'ro'
                      ? 'Blochează răspunsul'
                      : 'Block answer')
                  : payload.gameId === 'fact-or-fiction'
                    ? labels.blockTopic || 'Block set'
                    : payload.gameId === 'beep'
                      ? payload.blockQuestionLabel ||
                        (payload.appLanguage === 'ro'
                          ? 'Blochează seria'
                          : 'Block series')
                    : payload.gameId === 'sunt-o-banana'
                      ? payload.blockQuestionLabel ||
                        (payload.appLanguage === 'ro'
                          ? 'Blochează cuvântul'
                          : 'Block word')
                      : payload.gameId === 'povestea-betivului'
                        ? payload.blockQuestionLabel ||
                          (payload.appLanguage === 'ro'
                            ? 'Blochează perechea'
                            : 'Block pair')
              : labels.blockQuestion);

        pauseIcon.src = remoteState.isPaused
          ? './assets/play-circle.png'
          : './assets/pause-circle.png';
        pauseBtn.setAttribute('aria-label', remoteState.isPaused ? 'Resume' : 'Pause');

        updateTimer(payload, isResults, isPickGame);
      };

      const channel = client
        .channel(channelName, { config: { broadcast: { self: false } } })
        .on('broadcast', { event: 'score_state' }, ({ payload }) => {
          applyRemoteState(payload);
        });

      channel.subscribe((status) => {
        if (status === 'SUBSCRIBED') {
          setStatus('Connected', true);
          channel.send({
            type: 'broadcast',
            event: 'score_remote_command',
            payload: { action: 'request_state', source: 'remote_web' },
          });
          return;
        }
        if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') setStatus('Disconnected', false);
        else if (status === 'CLOSED') setStatus('Offline', false);
        else setStatus(`Status: ${status}`, false);
      });

      keepYesBtn.addEventListener('click', () => {
        if (!remoteState.canKeepCategory) return;
        sendCommand('keep_category_yes');
        if (navigator.vibrate) navigator.vibrate(20);
      });

      if (cateConfirmBtn) {
        cateConfirmBtn.addEventListener('click', () => {
          if (!remoteState.canMarkWords) return;
          sendCommand('confirm_cate_marks');
          if (navigator.vibrate) navigator.vibrate(20);
        });
      }

      if (clueBuzzP1Btn) {
        clueBuzzP1Btn.addEventListener('click', () => {
          if (!remoteState.canBuzz) return;
          sendCommand('buzz_p1');
          if (navigator.vibrate) navigator.vibrate(25);
        });
      }
      if (clueBuzzP2Btn) {
        clueBuzzP2Btn.addEventListener('click', () => {
          if (!remoteState.canBuzz) return;
          sendCommand('buzz_p2');
          if (navigator.vibrate) navigator.vibrate(25);
        });
      }
      if (clueBuzzBothBtn) {
        clueBuzzBothBtn.addEventListener('click', () => {
          if (!remoteState.canBuzz) return;
          sendCommand('buzz_both');
          if (navigator.vibrate) navigator.vibrate(25);
        });
      }
      if (clueSubmitBtn) {
        clueSubmitBtn.addEventListener('click', () => {
          if (!remoteState.canTypeGuess) return;
          sendCommand('submit_guess', {
            guessP1: clueGuessP1Input?.value || '',
            guessP2: clueGuessP2Input?.value || '',
          });
          if (navigator.vibrate) navigator.vibrate(20);
        });
      }

      const bindLongPress = (el, action) => {
        if (!el) return;
        let timer = null;
        const clear = () => {
          if (timer) clearTimeout(timer);
          timer = null;
        };
        const isPrepMode = () =>
          bananaPanelEl?.classList.contains('prep-mode');
        const setPeek = (peeking) => {
          if (!bananaWordValueEl) return;
          bananaWordPeeking = peeking;
          el.classList.toggle('peeking', peeking);
          if (el.classList.contains('revealed')) {
            renderBananaCardValue(bananaWordValueEl, lastBananaAnswer, false);
            return;
          }
          renderBananaCardValue(bananaWordValueEl, lastBananaAnswer, !peeking);
        };
        const start = (e) => {
          if (isPrepMode()) {
            setPeek(true);
            if (navigator.vibrate) navigator.vibrate(15);
            return;
          }
          if (el.classList.contains('revealed')) return;
          clear();
          timer = setTimeout(() => {
            sendCommand(action);
            if (navigator.vibrate) navigator.vibrate(30);
            clear();
          }, 400);
        };
        const end = () => {
          if (isPrepMode()) {
            setPeek(false);
          }
          clear();
        };
        el.addEventListener('touchstart', start, { passive: true });
        el.addEventListener('mousedown', start);
        el.addEventListener('touchend', end);
        el.addEventListener('touchcancel', end);
        el.addEventListener('mouseup', end);
        el.addEventListener('mouseleave', end);
        el.addEventListener('contextmenu', (e) => e.preventDefault());
      };

      bindLongPress(bananaWordCardEl, 'banana_reveal_word');

      if (bananaCategoryCardEl) {
        bananaCategoryCardEl.addEventListener('click', () => {
          if (bananaCategoryCardEl.disabled) return;
          sendCommand('banana_reveal_category');
          if (navigator.vibrate) navigator.vibrate(15);
        });
      }
      if (bananaHintCardEl) {
        bananaHintCardEl.addEventListener('click', () => {
          if (bananaHintCardEl.disabled) return;
          sendCommand('banana_reveal_hint');
          if (navigator.vibrate) navigator.vibrate(15);
        });
      }
      if (bananaGuessedBtn) {
        bananaGuessedBtn.addEventListener('click', () => {
          if (!remoteState.canBananaGuess) return;
          sendCommand('banana_guessed');
          if (navigator.vibrate) navigator.vibrate(25);
        });
      }
      if (bananaMissedBtn) {
        bananaMissedBtn.addEventListener('click', () => {
          if (!remoteState.canBananaGuess) return;
          sendCommand('banana_missed');
          if (navigator.vibrate) navigator.vibrate(25);
        });
      }
      if (bananaMarkQuestionBtn) {
        bananaMarkQuestionBtn.addEventListener('click', () => {
          if (!remoteState.canBananaGuess) return;
          sendCommand('banana_mark_question');
          if (navigator.vibrate) navigator.vibrate(15);
        });
      }
      if (bananaProceedBtn) {
        bananaProceedBtn.addEventListener('click', () => {
          if (!remoteState.canKeepCategory) return;
          sendCommand('keep_category_yes');
          if (navigator.vibrate) navigator.vibrate(20);
        });
      }
      if (drunkardNextBtn) {
        drunkardNextBtn.addEventListener('click', () => {
          if (!remoteState.canDrunkardPair) return;
          sendCommand('drunkard_next');
          if (navigator.vibrate) navigator.vibrate(25);
        });
      }
      if (drunkardSkipBtn) {
        drunkardSkipBtn.addEventListener('click', () => {
          if (!remoteState.canDrunkardPair) return;
          sendCommand('drunkard_skip');
          if (navigator.vibrate) navigator.vibrate(25);
        });
      }
      if (memoriaDecBtn) {
        memoriaDecBtn.addEventListener('click', () => {
          if (!remoteState.canMemoriaScore) return;
          sendCommand('memoria_remembered_dec');
          if (navigator.vibrate) navigator.vibrate(15);
        });
      }
      if (memoriaIncBtn) {
        memoriaIncBtn.addEventListener('click', () => {
          if (!remoteState.canMemoriaScore) return;
          sendCommand('memoria_remembered_inc');
          if (navigator.vibrate) navigator.vibrate(15);
        });
      }
      if (memoriaConfirmBtn) {
        memoriaConfirmBtn.addEventListener('click', () => {
          if (!remoteState.canMemoriaScore) return;
          sendCommand('memoria_score_confirm');
          if (navigator.vibrate) navigator.vibrate(20);
        });
      }

      keepNoBtn.addEventListener('click', () => {
        if (!remoteState.canKeepCategory) return;
        sendCommand('keep_category_no');
        if (navigator.vibrate) navigator.vibrate(20);
      });

      changeGameBtn.addEventListener('click', () => {
        if (!remoteState.canChangeGame) return;
        sendCommand('open_game_picker');
        if (navigator.vibrate) navigator.vibrate(20);
      });

      pickGameBackBtn.addEventListener('click', () => {
        if (!remoteState.canCancelGamePicker) return;
        sendCommand('cancel_game_picker');
        if (navigator.vibrate) navigator.vibrate(20);
      });

      pickPlayerP1Btn?.addEventListener('click', () => openAvatarPicker('p1'));
      pickPlayerP2Btn?.addEventListener('click', () => openAvatarPicker('p2'));
      avatarPickerCloseBtn?.addEventListener('click', () => closeAvatarPicker());
      avatarPickerOverlayEl?.addEventListener('click', (event) => {
        if (event.target === avatarPickerOverlayEl) closeAvatarPicker();
      });

      commandButtons.forEach((button) => {
        button.addEventListener('click', () => {
          sendCommand(button.dataset.action);
          if (navigator.vibrate) navigator.vibrate(20);
        });
      });
    </script>
  </body>
</html>
